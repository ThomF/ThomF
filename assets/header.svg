<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#1C1B19" opacity="0.04"/>
    </pattern>
    <clipPath id="panel"><rect x="4" y="42" width="892" height="254" rx="0"/></clipPath>
    <clipPath id="l1"><rect x="40" y="186" height="22" width="0"><animate attributeName="width" from="0" to="480" begin="0.4s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="212" height="22" width="0"><animate attributeName="width" from="0" to="480" begin="1.6s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="238" height="22" width="0"><animate attributeName="width" from="0" to="480" begin="2.8s" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="4" y="4" width="892" height="292" rx="16" fill="#EDE6D6" stroke="#1C1B19" stroke-width="4"/>
  <path d="M4 20 a16 16 0 0 1 16 -16 h860 a16 16 0 0 1 16 16 v22 h-892z" fill="#1C1B19"/>
  <circle cx="28" cy="23" r="6" fill="#D94A2B"/>
  <circle cx="48" cy="23" r="6" fill="#F2C230"/>
  <circle cx="68" cy="23" r="6" fill="#2E8C83"/>
  <text x="450" y="29" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#EDE6D6" letter-spacing="2">thomas.os</text>

  <!-- 70s stripe band on the right -->
  <g clip-path="url(#panel)" transform="translate(0 0)">
    <g transform="skewX(-20)">
      <rect x="760" y="42" width="34" height="260" fill="#D94A2B"/>
      <rect x="800" y="42" width="34" height="260" fill="#F28C28"/>
      <rect x="840" y="42" width="34" height="260" fill="#F2C230"/>
      <rect x="880" y="42" width="34" height="260" fill="#2E8C83"/>
      <rect x="920" y="42" width="60" height="260" fill="#1C1B19"/>
    </g>
  </g>
  <path d="M896 42 v238 a16 16 0 0 1 -16 16" fill="none" stroke="#1C1B19" stroke-width="4"/>

  <!-- greeting -->
  <text x="40" y="90" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#D94A2B" letter-spacing="3">HELLO, WORLD</text>
  <text x="38" y="146" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#1C1B19" letter-spacing="-1">HEY, I'M THOMAS.</text>
  <rect x="40" y="160" width="200" height="5" fill="#D94A2B"/>
  <rect x="244" y="160" width="40" height="5" fill="#F28C28"/>
  <rect x="288" y="160" width="16" height="5" fill="#2E8C83"/>

  <!-- typed lines -->
  <g font-family="'Courier New', Courier, monospace" font-size="17" font-weight="bold">
    <text x="40" y="202" fill="#2E8C83" clip-path="url(#l1)">&gt; full stack developer</text>
    <text x="40" y="228" fill="#1C1B19" clip-path="url(#l2)">&gt; boise codeworks graduate</text>
    <text x="40" y="254" fill="#D94A2B" clip-path="url(#l3)">&gt; learning react + flutter</text>
  </g>
  <rect x="318" y="240" width="11" height="17" fill="#D94A2B" opacity="0">
    <set attributeName="opacity" to="1" begin="4s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4s" repeatCount="indefinite"/>
  </rect>

  <rect x="4" y="42" width="892" height="254" fill="url(#scan)"/>
</svg>
