<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#8a6224"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="l1"><rect x="40" y="166" height="22" width="0"><animate attributeName="width" to="420" begin="0.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="190" height="22" width="0"><animate attributeName="width" to="420" begin="1.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="214" height="22" width="0"><animate attributeName="width" to="420" begin="2.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="320" rx="10" fill="#0b0a08"/>
  <rect x="1" y="1" width="898" height="318" rx="10" fill="none" stroke="#3a3024" stroke-width="2"/>

  <!-- hazard band -->
  <rect x="20" y="20" width="860" height="8" fill="url(#hazard)" opacity="0.7"/>

  <!-- name block -->
  <g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="40" y="66" font-size="11" fill="#6b6354" letter-spacing="3.5">░▒▓ PROFILE // ThomF</text>
    <text x="40" y="112" font-size="34" font-weight="700" fill="#ffb53d" letter-spacing="9" filter="url(#glow)">THOMAS FUHRIMAN</text>
    <text x="40" y="138" font-size="12" fill="#8a6224" letter-spacing="3">APP DEVELOPER · BOISE CODEWORKS GRAD</text>

    <!-- terminal lines -->
    <text x="40" y="181" font-size="14" fill="#e8d5ad" clip-path="url(#l1)"><tspan fill="#7ddba0">$</tspan> whoami → app developer</text>
    <text x="40" y="205" font-size="14" fill="#e8d5ad" clip-path="url(#l2)"><tspan fill="#7ddba0">$</tspan> stack → vue · .net · node</text>
    <text x="40" y="229" font-size="14" fill="#e8d5ad" clip-path="url(#l3)"><tspan fill="#7ddba0">$</tspan> learning → react · go</text>
    <rect x="242" y="217" width="9" height="15" fill="#ffb53d" opacity="0">
      <set attributeName="opacity" to="1" begin="3.4s"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- status panel -->
    <rect x="560" y="52" width="320" height="186" fill="#15120d" stroke="#3a3024"/>
    <rect x="560" y="52" width="320" height="26" fill="#1d1812" stroke="#3a3024"/>
    <text x="574" y="70" font-size="10" fill="#8a6224" letter-spacing="3">STATUS</text>
    <circle cx="862" cy="65" r="4" fill="#7ddba0"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>

    <g font-size="11" letter-spacing="1.5">
      <text x="576" y="104" fill="#6b6354">MODE</text>     <text x="866" y="104" text-anchor="end" fill="#7ddba0">BUILDING</text>
      <text x="576" y="128" fill="#6b6354">FOCUS</text>    <text x="866" y="128" text-anchor="end" fill="#e8d5ad">FULL STACK APPS</text>
      <text x="576" y="152" fill="#6b6354">LEARNING</text> <text x="866" y="152" text-anchor="end" fill="#e8d5ad">REACT / GO</text>
      <text x="576" y="176" fill="#6b6354">OPEN TO</text>  <text x="866" y="176" text-anchor="end" fill="#ffb53d">NEW PROJECTS</text>
    </g>
    <!-- progress meter -->
    <rect x="576" y="196" width="290" height="10" fill="#0c0a07" stroke="#3a3024"/>
    <rect x="577" y="197" width="0" height="8" fill="#ffb53d">
      <animate attributeName="width" values="0;288;288" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="576" y="226" font-size="9" fill="#6b6354" letter-spacing="2">LOADING NEXT IDEA...</text>
  </g>

  <!-- process strip -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="2.5" text-anchor="middle">
    <rect x="20" y="258" width="860" height="30" fill="#0c0a07" stroke="#3a3024"/>
    <rect x="20" y="258" width="172" height="30" fill="#ffb53d" opacity="0">
      <animate attributeName="x" values="20;192;364;536;708;20" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
      <set attributeName="opacity" to="0.22" begin="0s"/>
    </rect>
    <line x1="192" y1="258" x2="192" y2="288" stroke="#3a3024"/>
    <line x1="364" y1="258" x2="364" y2="288" stroke="#3a3024"/>
    <line x1="536" y1="258" x2="536" y2="288" stroke="#3a3024"/>
    <line x1="708" y1="258" x2="708" y2="288" stroke="#3a3024"/>
    <g fill="#c9a05a">
      <text x="106" y="277">IDEA</text>
      <text x="278" y="277">DESIGN</text>
      <text x="450" y="277">BUILD</text>
      <text x="622" y="277">TEST</text>
      <text x="794" y="277">SHIP</text>
    </g>
  </g>

  <text x="880" y="306" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#3a3024" letter-spacing="2">THOMAS.OS v3</text>

  <rect width="900" height="320" rx="10" fill="url(#scan)" opacity="0.5"/>
</svg>
